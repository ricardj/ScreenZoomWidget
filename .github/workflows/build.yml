name: Android Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.set_apk_info.outputs.name }}
      apk_path: ${{ steps.set_apk_info.outputs.path }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: android-app

    - name: Build debug APK
      run: ./gradlew assembleDebug
      working-directory: android-app

    - name: Set APK Info
      id: set_apk_info
      run: |
        VERSION_NAME=$(grep "versionName =" android-app/app/build.gradle.kts | awk -F'"' '{print $2}')
        APK_NAME="ZoomWidget_$VERSION_NAME"
        APK_PATH="android-app/app/build/outputs/apk/debug/$APK_NAME.apk"
        mv android-app/app/build/outputs/apk/debug/app-debug.apk "$APK_PATH"
        echo "name=$APK_NAME" >> $GITHUB_OUTPUT
        echo "path=$APK_PATH" >> $GITHUB_OUTPUT

    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.set_apk_info.outputs.name }}
        path: ${{ steps.set_apk_info.outputs.path }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ needs.build.outputs.apk_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false

